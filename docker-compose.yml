services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-threadflow}
      POSTGRES_USER: ${POSTGRES_USER:-threadflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-threadflow}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${POSTGRES_PORT_HOST:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: ${REDIS_IMAGE:-redis:8.10.0-alpine}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-threadflow}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-threadflow}", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${REDIS_PORT_HOST:-6380}:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      POSTGRES_DB: ${POSTGRES_DB:-threadflow}
      POSTGRES_USER: ${POSTGRES_USER:-threadflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-threadflow}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-only-insecure-secret}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend,host.docker.internal}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8080}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      POSTGRES_CONN_MAX_AGE: ${POSTGRES_CONN_MAX_AGE:-60}
      REDIS_URL: redis://:${REDIS_PASSWORD:-threadflow}@redis:6379/0
      DEMO_USER_NAME: ${DEMO_USER_NAME:-demo}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-demo@threadflow.local}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-demo-password}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - static_data:/app/backend/staticfiles
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 10

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    volumes:
      - static_data:/srv/static:ro

volumes:
  postgres_data:
  redis_data:
  static_data:
