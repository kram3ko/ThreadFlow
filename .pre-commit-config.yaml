default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: uv run --group lint pyright
        language: system
        pass_filenames: false
        types: [python]

      - id: backend-tests
        name: backend tests
        entry: uv run --group test pytest
        language: system
        pass_filenames: false
        stages: [pre-push]
