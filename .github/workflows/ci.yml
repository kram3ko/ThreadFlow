name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Check dependency lock
        run: uv lock --check

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check types
        run: uv run pyright

      - name: Run Django checks
        run: |
          uv run python backend/manage.py check
          uv run python backend/manage.py makemigrations --check --dry-run

      - name: Validate OpenAPI schema
        run: uv run python backend/manage.py spectacular --validate --file /tmp/threadflow-schema.yaml

      - name: Run tests with coverage
        run: uv run pytest --cov

      - name: Audit dependencies
        run: uv run pip-audit

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Validate Playwright suite
        run: npx playwright test --list

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare environment
        run: cp .env.example .env

      - name: Start application
        run: docker compose --env-file .env up -d --build --wait --wait-timeout 240

      - name: Run browser journey
        run: |
          credentials=$(docker compose --env-file .env run --rm backend \
            python manage.py prepare_load_captchas --count 8 | tail -n 1)
          E2E_CAPTCHAS="$credentials" docker compose --env-file .env --profile e2e \
            run --rm playwright

      - name: Show service logs on failure
        if: failure()
        run: docker compose --env-file .env logs --no-color --tail 200

      - name: Stop application
        if: always()
        run: docker compose --env-file .env down --volumes

  load-test-contracts:
    name: Load-test contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build k6 suite
        run: docker build -f docker/k6/Dockerfile -t threadflow-k6 .

      - name: Validate k6 scenarios
        run: |
          docker run --rm --entrypoint k6 threadflow-k6 inspect /scripts/api.js
          docker run --rm --entrypoint k6 threadflow-k6 inspect /scripts/websocket.js
